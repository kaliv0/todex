[project]
name = "todex"
description = "CLI TODO extractor"
keywords = ["TODO extractor", "cli tool"]
authors = [
  {name = "kaliv0", email = "kaliv.zero@gmail.com"},
]
urls = {repository = "https://github.com/kaliv0/todex.git"}
license-files = ["LICENSE"]
readme = "README.md"
dynamic = ["version"]

requires-python = ">=3.12"
dependencies = [
    "pathspec>=1.1.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=8.0.0",
    "ruff>=0.16.8",
]

[project.scripts]
todex = "todex.__main__:main"
tdx = "todex.__main__:main"

[build-system]
build-backend = "pdm.backend"
requires = ["pdm-backend"]

[tool.pdm.build]
excludes = ["tests"]

[tool.pdm.version]
source = "file"
path = "todex/__init__.py"

[tool.ruff]
fix = true
line-length = 110
exclude = ["tests/testdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
]
